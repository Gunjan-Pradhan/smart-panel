# Smart Load Protection Panel - Mosquitto configuration
#
# PURPOSE
#   Local development broker for MQTT contract testing.
#
# SECURITY WARNING
#   Anonymous clients are allowed for local development only. The Docker port
#   is published on 127.0.0.1 (see docker-compose.yml), so the broker is not
#   reachable from the LAN in this configuration.
#
#   Before the ESP32-S3 connects over the network, or before any non-local
#   deployment, this file MUST be changed to:
#       allow_anonymous false
#       password_file /mosquitto/config/passwd
#   and per-device topic permissions must be applied (see docs/mqtt_contract.md).
#
# The line "listener 1883" is required for Mosquitto 2.x to accept TCP clients
# at all; without an explicit listener the broker only listens on loopback
# inside the container.

listener 1883 0.0.0.0
protocol mqtt

allow_anonymous true

# Persist retained messages and queued messages across broker restarts inside
# the named Docker volume "smart-panel-mosquitto-data".
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# Reject oversized frames early. Telemetry messages are well under 1 KB.
message_size_limit 16384

# Logging goes to the Docker log stream so "docker compose logs" works.
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%SZ

# Publish broker statistics on $SYS topics every 10 seconds.
sys_interval 10

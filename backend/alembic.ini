# Alembic configuration for the Smart Load Protection Panel backend.
#
# Run all commands from the backend/ directory:
#   ..\.venv\Scripts\alembic.exe upgrade head
#   ..\.venv\Scripts\alembic.exe downgrade base
#   ..\.venv\Scripts\alembic.exe current
#
# The database URL is NOT stored here. alembic/env.py reads it from the
# application settings (.env at the repository root), so credentials never
# appear in a tracked file.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s
path_separator = os
# Placeholder only; env.py always derives the real URL from app settings.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

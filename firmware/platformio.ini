; PlatformIO Project Configuration File for Smart Load Protection Panel
;
; Authoritative targets:
;   - esp32s3: Embedded target for ESP32-S3 (Arduino framework + FreeRTOS)
;   - native: Host unit test target for laptop verification (pure C++ tests)

[platformio]
default_envs = native

[env:native]
platform = native
test_framework = unity
build_flags = 
    -std=c++14
    -D UNIT_TEST
    -D NATIVE_TEST
test_build_src = true

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.4

